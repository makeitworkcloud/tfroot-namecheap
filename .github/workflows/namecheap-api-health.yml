name: namecheap-api-health

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: namecheap-api-health
  cancel-in-progress: false

jobs:
  check:
    name: Namecheap API allowlist health
    runs-on: arc-tf
    timeout-minutes: 2
    steps:
      - name: Check Namecheap API access
        id: health
        shell: bash
        env:
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
        run: |
          set -uo pipefail

          is_ipv4() {
            local candidate="$1"
            local octet
            local -a octets
            IFS='.' read -r -a octets <<< "$candidate"
            [ "${#octets[@]}" -eq 4 ] || return 1
            for octet in "${octets[@]}"; do
              [[ "$octet" =~ ^[0-9]+$ ]] || return 1
              (( 10#$octet <= 255 )) || return 1
            done
          }

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status=failed
          detail='Namecheap API request did not complete.'
          egress_ipv4=''

          for endpoint in https://ifconfig.me/ip https://checkip.amazonaws.com; do
            candidate="$(curl -4 --fail --silent --show-error --max-time 10 "$endpoint" | tr -d '\r\n')" || continue
            if is_ipv4 "$candidate"; then
              egress_ipv4="$candidate"
              break
            fi
          done

          if [ -z "$egress_ipv4" ]; then
            detail='Could not determine a valid IPv4 egress address.'
          elif [ -z "${NAMECHEAP_API_KEY:-}" ]; then
            detail='NAMECHEAP_API_KEY is unavailable to this workflow.'
          else
            escaped_api_key=${NAMECHEAP_API_KEY//\\/\\\\}
            escaped_api_key=${escaped_api_key//\"/\\\"}
            escaped_api_key=${escaped_api_key//$'\r'/\\r}
            escaped_api_key=${escaped_api_key//$'\n'/\\n}

            # Keep the API key out of process arguments by passing curl options on stdin.
            if {
              printf '%s\n' \
                'url = "https://api.namecheap.com/xml.response"' \
                'get' \
                'data-urlencode = "ApiUser=makeitworkcloud"' \
                "data-urlencode = \"ApiKey=${escaped_api_key}\"" \
                'data-urlencode = "UserName=makeitworkcloud"' \
                "data-urlencode = \"ClientIp=${egress_ipv4}\"" \
                'data-urlencode = "Command=namecheap.users.getPricing"' \
                'data-urlencode = "ProductType=DOMAIN"'
            } | curl -4 --disable --config - --fail --silent --show-error --max-time 20 --output "$response_file"; then
              if grep -q 'Status="OK"' "$response_file"; then
                status=healthy
                detail='Authenticated Namecheap API request succeeded.'
              elif grep -q 'Invalid request IP' "$response_file"; then
                namecheap_ipv4="$(grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$response_file" | head -n 1 || true)"
                if is_ipv4 "$namecheap_ipv4"; then
                  egress_ipv4="$namecheap_ipv4"
                fi
                detail="Namecheap rejected egress IPv4 ${egress_ipv4}; update the manual Namecheap API allowlist."
              else
                detail='Namecheap returned an unsuccessful API response.'
              fi
            else
              detail="Could not reach the Namecheap API from egress IPv4 ${egress_ipv4}."
            fi
          fi

          {
            echo "status=${status}"
            echo "egress_ipv4=${egress_ipv4}"
            echo "detail=${detail}"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update health issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          EGRESS_IPV4: ${{ steps.health.outputs.egress_ipv4 }}
          HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
        with:
          script: |
            const marker = '<!-- namecheap-api-health -->';
            const status = process.env.HEALTH_STATUS || 'failed';
            const egressIpv4 = process.env.EGRESS_IPV4 || 'unknown';
            const detail = process.env.HEALTH_DETAIL || 'No health-check detail was captured.';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const matchingIssues = issues.filter((issue) =>
              !issue.pull_request && issue.body?.includes(marker),
            );

            if (status === 'healthy') {
              await Promise.all(matchingIssues
                .filter((issue) => issue.state === 'open')
                .map((issue) => github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                })));
              return;
            }

            const body = [
              marker,
              '## Namecheap API health check failed',
              '',
              `- Egress IPv4: \`${egressIpv4}\``,
              `- Detail: ${detail}`,
              '',
              'This alert performs a read-only API check. It does not change Namecheap DNS, the API allowlist, or credentials.',
            ].join('\n');
            const title = 'Namecheap API health check failed';
            const existing = matchingIssues.sort((left, right) => left.number - right.number)[0];

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Fail unhealthy check
        if: steps.health.outputs.status != 'healthy'
        env:
          EGRESS_IPV4: ${{ steps.health.outputs.egress_ipv4 }}
          HEALTH_DETAIL: ${{ steps.health.outputs.detail }}
        run: |
          echo "Observed IPv4: ${EGRESS_IPV4:-unknown}" >&2
          echo "$HEALTH_DETAIL" >&2
          exit 1
